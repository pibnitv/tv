<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIBNI - Painel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:#0b1a2e;color:#fff;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 1.2rem;background:#132b4a;border-top:6px solid #d3dce7}
header img{max-height:4.4rem;width:auto}
.titulo{text-align:center;flex:1}
.titulo h1{font-size:2rem;letter-spacing:.05em}
.titulo p{font-size:1.1rem;opacity:.85}
.relogio{text-align:right;font-size:1.1rem;line-height:1.4}
.relogio strong{font-size:2rem;display:block}
main{flex:1;display:grid;grid-template-columns:2fr 1fr;gap:1rem;padding:1rem;min-height:0}
.card{background:#132b4a;border-radius:10px;padding:1rem;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.card h2{font-size:1.3rem;margin-bottom:.6rem;color:#d3dce7;border-bottom:2px solid #d3dce7;padding-bottom:.3rem}
.agenda-titulo{font-size:1.5rem;margin-bottom:.6rem;color:#d3dce7;border-bottom:2px solid #d3dce7;padding-bottom:.3rem}
ul{list-style:none}
li{padding:.35rem 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:1.05rem}
.hoje{color:#ffd166;font-weight:bold}
.direita{display:flex;flex-direction:column;gap:1rem;min-height:0}
.direita .card{flex:1;min-height:0;overflow:hidden}
footer{background:#132b4a;padding:.5rem 0;overflow:hidden;white-space:nowrap;font-size:1.2rem;min-height:3rem;display:flex;align-items:center}
.faixa{display:inline-block;padding-left:100%;animation:correr 70s linear infinite}
@keyframes correr{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.oculto{display:none!important}
.clima{font-size:1.1rem}
</style>
</head>
<body>

<header>
  <img src="logo-pibni.png" alt="PIBNI">
  <div class="titulo">
    <h1>PRIMEIRA IGREJA BATISTA DE NOVA IGUAÇU</h1>
    <p>Painel de Avisos</p>
  </div>
  <div class="relogio">
    <strong id="hora">--:--</strong>
    <span id="data"></span><br>
    <span class="clima" id="clima"></span>
  </div>
</header>

<main>
  <section class="card" id="secAgenda">
    <div class="agenda-titulo" id="agendaTitulo">Agenda</div>
    <ul id="agendaLista"></ul>
  </section>

  <div class="direita">
    <section class="card" id="secAvisos">
      <h2>Avisos</h2>
      <ul id="listaAvisos"></ul>
    </section>
    <section class="card" id="secAniv">
      <h2>Aniversariantes do mês</h2>
      <ul id="listaAniv"></ul>
    </section>
    <section class="card" id="secNoticias">
      <h2>Notícias</h2>
      <ul id="listaNoticias"></ul>
    </section>
  </div>
</main>

<footer id="rodape">
  <span class="faixa" id="faixa"></span>
</footer>

<script>
/* ========== CONFIGURAÇÃO ========== */
const PLANILHA_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxeZ8ELfbuLySISLTWO6UQbTFDwgz4HoLu2R-gdb7BTfpOvM8Uijgw3N9tymNYYmVbPxU-JY_jJMCp/pub';
const GIDS = {
  CONTROLE: 0,
  AVISOS: 1309089437,
  NOTICIAS: 852857065,
  ANIVERSARIOS: 289359330,
  RODAPE: 228875664
};
const CALENDAR_ID = 'pibnirj@gmail.com';
const CALENDAR_KEY = 'AIzaSyDVzB9Db_MhQXdDyIYBPP3XJd33VszOr64';
const AGENDA_DIAS = 30;
const INTERVALO_ATUALIZACAO = 600000;
const CLIMA_CIDADE = 'Nova Iguaçu,BR';
const CLIMA_CHAVE = '';

/* ========== UTILITÁRIOS ========== */
function urlCsv(gid){
  return `${PLANILHA_BASE}?gid=${gid}&single=true&output=csv`;
}

function parseCsv(texto){
  const linhas = [];
  let linha = [], campo = '', aspas = false;
  for(let i=0;i<texto.length;i++){
    const c = texto[i];
    if(aspas){
      if(c === '"' && texto[i+1] === '"'){ campo += '"'; i++; }
      else if(c === '"'){ aspas = false; }
      else campo += c;
    } else {
      if(c === '"') aspas = true;
      else if(c === ','){ linha.push(campo); campo = ''; }
      else if(c === '\n'){ linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
      else if(c !== '\r') campo += c;
    }
  }
  if(campo.length || linha.length){ linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(x => x.trim() !== ''));
}

function paraObjetos(linhas){
  if(!linhas.length) return [];
  const cab = linhas[0].map(h => h.trim().toUpperCase());
  return linhas.slice(1).map(l => {
    const o = {};
    cab.forEach((h,i) => o[h] = (l[i] || '').trim());
    return o;
  });
}

function simOuVerdadeiro(v){
  return ['SIM','S','TRUE','VERDADEIRO','1'].includes(String(v).trim().toUpperCase());
}

function escapar(t){
  const d = document.createElement('div');
  d.textContent = t == null ? '' : String(t);
  return d.innerHTML;
}

async function buscarCsv(gid){
  const r = await fetch(urlCsv(gid) + '&t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('Falha ao ler aba ' + gid);
  return parseCsv(await r.text());
}

/* ========== CONTROLE ========== */
let controle = {};
async function carregarControle(){
  const linhas = await buscarCsv(GIDS.CONTROLE);
  controle = {};
  paraObjetos(linhas).forEach(o => {
    if(o.CHAVE) controle[o.CHAVE.toUpperCase()] = o.VALOR;
  });
  if(simOuVerdadeiro(controle.RECARREGAR_PAINEL)){
    // Recarrega uma vez. Para isso funcionar como solicitação única,
    // a célula RECARREGAR_PAINEL na planilha precisa ser alterada para NAO manualmente.
    location.reload();
  }
}

function aplicarVisibilidade(){
  document.getElementById('secAgenda').classList.toggle('oculto', !simOuVerdadeiro(controle.MOSTRAR_AGENDA));
  document.getElementById('secAniv').classList.toggle('oculto', !simOuVerdadeiro(controle.MOSTRAR_ANIVERSARIOS));
  document.getElementById('rodape').classList.toggle('oculto', !simOuVerdadeiro(controle.MOSTRAR_RODAPE));
}

/* ========== AVISOS ========== */
async function carregarAvisos(){
  const itens = paraObjetos(await buscarCsv(GIDS.AVISOS)).filter(o => simOuVerdadeiro(o.ATIVO));
  const ul = document.getElementById('listaAvisos');
  ul.innerHTML = itens.length
    ? itens.map(o => `<li>${escapar(o.TEXTO)}</li>`).join('')
    : '<li>Nenhum aviso no momento.</li>';
}

/* ========== NOTÍCIAS ========== */
async function carregarNoticias(){
  const itens = paraObjetos(await buscarCsv(GIDS.NOTICIAS)).filter(o => simOuVerdadeiro(o.ATIVO));
  const ul = document.getElementById('listaNoticias');
  ul.innerHTML = itens.length
    ? itens.map(o => `<li><strong>${escapar(o.TITULO)}</strong><br>${escapar(o.TEXTO)}</li>`).join('')
    : '<li>Nenhuma notícia no momento.</li>';
}

/* ========== ANIVERSÁRIOS ========== */
// Mostra os aniversariantes do mês atual, com destaque para o dia de hoje.
async function carregarAniversarios(){
  const itens = paraObjetos(await buscarCsv(GIDS.ANIVERSARIOS));
  const hoje = new Date();
  const mesAtual = hoje.getMonth() + 1;
  const diaAtual = hoje.getDate();

  const doMes = itens
    .filter(o => o.NOME && parseInt(o.MES, 10) === mesAtual)
    .sort((a,b) => parseInt(a.DIA,10) - parseInt(b.DIA,10));

  const ul = document.getElementById('listaAniv');
  ul.innerHTML = doMes.length
    ? doMes.map(o => {
        const dia = parseInt(o.DIA, 10);
        const ehHoje = dia === diaAtual;
        const marca = ehHoje ? ' <span class="hoje">HOJE</span>' : '';
        return `<li class="${ehHoje ? 'hoje' : ''}">${String(dia).padStart(2,'0')}/${String(mesAtual).padStart(2,'0')} - ${escapar(o.NOME)}${marca}</li>`;
      }).join('')
    : '<li>Nenhum aniversariante este mês.</li>';
}

/* ========== RODAPÉ ========== */
async function carregarRodape(){
  const itens = paraObjetos(await buscarCsv(GIDS.RODAPE)).filter(o => simOuVerdadeiro(o.ATIVO));
  const textos = itens.map(o => o.TEXTO).filter(Boolean);
  document.getElementById('faixa').textContent = textos.join('   •   ');
}

/* ========== AGENDA (Google Calendar) ========== */
async function carregarAgenda(){
  const lista = document.getElementById('agendaLista');
  const agora = new Date();
  const fim = new Date(agora.getTime() + AGENDA_DIAS * 86400000);

  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events` +
    `?key=${encodeURIComponent(CALENDAR_KEY)}&singleEvents=true&orderBy=startTime` +
    `&timeMin=${encodeURIComponent(agora.toISOString())}&timeMax=${encodeURIComponent(fim.toISOString())}&maxResults=50`;

  const r = await fetch(url);
  if(!r.ok) throw new Error('Falha ao ler agenda: ' + r.status);
  const dados = await r.json();
  const eventos = dados.items || [];

  lista.innerHTML = eventos.length
    ? eventos.map(ev => {
        const ehDiaTodo = !ev.start.dateTime;
        // Eventos de dia inteiro vêm como AAAA-MM-DD; o T00:00:00 evita deslocamento de fuso.
        const ini = ehDiaTodo ? new Date(ev.start.date + 'T00:00:00') : new Date(ev.start.dateTime);
        const data = ini.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'});
        const hora = ehDiaTodo
          ? 'Dia todo'
          : ini.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        const ehHoje = ini.toDateString() === agora.toDateString();
        return `<li class="${ehHoje ? 'hoje' : ''}">${data} ${hora} - ${escapar(ev.summary || 'Sem título')}</li>`;
      }).join('')
    : '<li>Nenhum evento nos próximos dias.</li>';
}

/* ========== RELÓGIO E CLIMA ========== */
function atualizarRelogio(){
  const agora = new Date();
  document.getElementById('hora').textContent =
    agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('data').textContent =
    agora.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
}

async function carregarClima(){
  if(!CLIMA_CHAVE){
    document.getElementById('clima').textContent = '';
    return;
  }
  const r = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(CLIMA_CIDADE)}&units=metric&lang=pt_br&appid=${CLIMA_CHAVE}`);
  if(!r.ok) return;
  const d = await r.json();
  document.getElementById('clima').textContent =
    `${Math.round(d.main.temp)}°C - ${d.weather[0].description}`;
}

/* ========== CICLO PRINCIPAL ========== */
async function atualizarTudo(){
  try{ await carregarControle(); }catch(e){ console.error(e); }
  aplicarVisibilidade();
  const tarefas = [
    carregarAvisos(),
    carregarNoticias(),
    carregarAniversarios(),
    carregarRodape(),
    carregarAgenda(),
    carregarClima()
  ];
  const resultados = await Promise.allSettled(tarefas);
  resultados.forEach(r => { if(r.status === 'rejected') console.error(r.reason); });
}

atualizarRelogio();
setInterval(atualizarRelogio, 1000);
atualizarTudo();
setInterval(atualizarTudo, INTERVALO_ATUALIZACAO);
</script>
</body>
</html>
