<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIBNI - Painel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:#0b1a2e;color:#fff;display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 1.2rem;background:#132b4a;border-top:6px solid #d3dce7}
header img{max-height:4.4rem;width:auto}
.titulo{text-align:center;flex:1}
.titulo h1{font-size:2rem;letter-spacing:.05em}
.titulo p{font-size:1.1rem;opacity:.85}
.relogio{text-align:right;font-size:1.1rem;line-height:1.4}
.relogio strong{font-size:2rem;display:block}
.clima{font-size:1.1rem}

main{flex:1;display:grid;grid-template-columns:2fr 1fr;gap:1rem;padding:1rem;min-height:0}
.esquerda{display:flex;flex-direction:column;gap:1rem;min-height:0}
.direita{display:flex;flex-direction:column;gap:1rem;min-height:0}
.direita .card{flex:1;min-height:0;overflow:hidden}

.card{background:#132b4a;border-radius:10px;padding:1rem;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.card h2{font-size:1.3rem;margin-bottom:.6rem;color:#d3dce7;border-bottom:2px solid #d3dce7;padding-bottom:.3rem}
.agenda-titulo{font-size:1.5rem;margin-bottom:.6rem;color:#d3dce7;border-bottom:2px solid #d3dce7;padding-bottom:.3rem}
#secMidia{flex:1.2;min-height:0}
#secAgenda{flex:1;min-height:0}

.midia{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:8px;background:#000}
.midia > *{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.midia .vazio{display:flex;align-items:center;justify-content:center;height:100%;color:#d3dce7;font-size:1.2rem}

ul{list-style:none}
li{padding:.35rem 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:1.05rem}
.hoje{color:#ffd166;font-weight:bold}

footer{background:#132b4a;padding:.5rem 0;overflow:hidden;white-space:nowrap;font-size:1.2rem;min-height:3rem;display:flex;align-items:center}
.faixa{display:inline-block;padding-left:100%;animation:correr 70s linear infinite}
@keyframes correr{from{transform:translateX(0)}to{transform:translateX(-100%)}}

.oculto{display:none!important}
</style>
</head>
<body>
<header>
  <img src="logo-pibni.png" alt="PIBNI">
  <div class="titulo">
    <h1>PRIMEIRA IGREJA BATISTA DE NOVA IGUAÇU</h1>
    <p>Painel de Avisos</p>
  </div>
  <div class="relogio">
    <strong id="hora">--:--</strong>
    <span id="data"></span><br>
    <span class="clima" id="clima"></span>
  </div>
</header>

<main>
  <div class="esquerda">
    <section class="card" id="secMidia">
      <h2>Destaques</h2>
      <div class="midia" id="midia"><div class="vazio">Carregando material...</div></div>
    </section>

    <section class="card" id="secAgenda">
      <div class="agenda-titulo">Agenda</div>
      <ul id="agendaLista"></ul>
    </section>
  </div>

  <div class="direita">
    <section class="card" id="secAvisos">
      <h2>Avisos</h2>
      <ul id="listaAvisos"></ul>
    </section>
    <section class="card" id="secAniv">
      <h2>Aniversariantes do mês</h2>
      <ul id="listaAniv"></ul>
    </section>
    <section class="card" id="secNoticias">
      <h2>Notícias</h2>
      <ul id="listaNoticias"></ul>
    </section>
  </div>
</main>

<footer id="rodape">
  <span class="faixa" id="faixa"></span>
</footer>
<script>
/* ========== CONFIGURAÇÃO ========== */
const PLANILHA_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxeZ8ELfbuLySISLTWO6UQbTFDwgz4HoLu2R-gdb7BTfpOvM8Uijgw3N9tymNYYmVbPxU-JY_jJMCp/pub';
const GIDS = {
  CONTROLE: 0,
  AVISOS: 1309089437,
  NOTICIAS: 852857065,
  ANIVERSARIOS: 289359330,
  RODAPE: 228875664
};
const CALENDAR_ID = 'pibnirj@gmail.com';
const CALENDAR_KEY = 'AIzaSyDVzB9Db_MhQXdDyIYBPP3XJd33VszOr64';
const DRIVE_PASTA_ID = '1efxTP1wE4ywREhQZzm5CZpImgOmPrtO5';
const DRIVE_KEY = 'AIzaSyBNKJRabhnu9_uiYhIKErUWW-SdOrY6Woc';
const MIDIA_TEMPO_IMAGEM = 10000;
const AGENDA_DIAS = 30;
const INTERVALO_ATUALIZACAO = 600000;
const CLIMA_CIDADE = 'Nova Iguaçu,BR';
const CLIMA_CHAVE = '';

let controle = {};

/* ========== UTILITÁRIOS ========== */
function urlCsv(gid){
  return `${PLANILHA_BASE}?gid=${gid}&single=true&output=csv`;
}

function parseCsv(texto){
  const linhas = [];
  let linha = [], campo = '', aspas = false;
  for(let i=0;i<texto.length;i++){
    const c = texto[i];
    if(aspas){
      if(c === '"' && texto[i+1] === '"'){ campo += '"'; i++; }
      else if(c === '"'){ aspas = false; }
      else campo += c;
    } else {
      if(c === '"') aspas = true;
      else if(c === ','){ linha.push(campo); campo = ''; }
      else if(c === '\n'){ linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
      else if(c !== '\r') campo += c;
    }
  }
  if(campo.length || linha.length){ linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(v => v.trim() !== ''));
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'&quot;',"'":'&#39;'}[c]));
}

function simOuVerdadeiro(v){
  return ['SIM','S','TRUE','VERDADEIRO','1'].includes(String(v ?? '').trim().toUpperCase());
}

async function buscarCsv(gid){
  const resp = await fetch(urlCsv(gid) + '&t=' + Date.now(), { cache: 'no-store' });
  if(!resp.ok) throw new Error('Falha ao ler aba ' + gid + ': ' + resp.status);
  return parseCsv(await resp.text());
}

async function carregarControle(){
  const linhas = await buscarCsv(GIDS.CONTROLE);
  controle = {};
  for(const l of linhas.slice(1)){
    const chave = (l[0] || '').trim().toUpperCase();
    if(chave) controle[chave] = (l[1] || '').trim();
  }
  return controle;
}

function aplicarVisibilidade(){
  const mostra = (chave) => controle[chave] === undefined ? true : simOuVerdadeiro(controle[chave]);
  document.getElementById('secAgenda').classList.toggle('oculto', !mostra('MOSTRAR_AGENDA'));
  document.getElementById('secAniv').classList.toggle('oculto', !mostra('MOSTRAR_ANIVERSARIOS'));
  document.getElementById('rodape').classList.toggle('oculto', !mostra('MOSTRAR_RODAPE'));
  document.getElementById('secMidia').classList.toggle('oculto', !mostra('MOSTRAR_MIDIA'));
}

async function carregarAvisos(){
  const linhas = await buscarCsv(GIDS.AVISOS);
  const ul = document.getElementById('listaAvisos');
  const itens = linhas.slice(1).filter(l => l[0]);
  ul.innerHTML = itens.length
    ? itens.map(l => `<li>${escapeHtml(l[0])}${l[1] ? ' - ' + escapeHtml(l[1]) : ''}</li>`).join('')
    : '<li>Nenhum aviso no momento</li>';
}

async function carregarNoticias(){
  const linhas = await buscarCsv(GIDS.NOTICIAS);
  const ul = document.getElementById('listaNoticias');
  const itens = linhas.slice(1).filter(l => l[0]);
  ul.innerHTML = itens.length
    ? itens.map(l => `<li>${escapeHtml(l[0])}</li>`).join('')
    : '<li>Nenhuma notícia no momento</li>';
}
async function carregarAniversarios(){
  const linhas = await buscarCsv(GIDS.ANIVERSARIOS);
  const ul = document.getElementById('listaAniv');
  const hoje = new Date();
  const diaHoje = hoje.getDate();
  const mesHoje = hoje.getMonth() + 1;
  const itens = linhas.slice(1)
    .filter(l => l[0] && Number(l[2]) === mesHoje)
    .sort((a,b) => Number(a[1]) - Number(b[1]));
  ul.innerHTML = itens.length
    ? itens.map(l => {
        const hojeClasse = Number(l[1]) === diaHoje ? ' class="hoje"' : '';
        const marca = Number(l[1]) === diaHoje ? ' - HOJE' : '';
        return `<li${hojeClasse}>${String(l[1]).padStart(2,'0')}/${String(l[2]).padStart(2,'0')} - ${escapeHtml(l[0])}${marca}</li>`;
      }).join('')
    : '<li>Nenhum aniversariante neste mês</li>';
}

async function carregarRodape(){
  const linhas = await buscarCsv(GIDS.RODAPE);
  const faixa = document.getElementById('faixa');
  const ativos = linhas.slice(1).filter(l => l[0] && simOuVerdadeiro(l[1]));
  const textos = ativos.map(l => escapeHtml(l[0]));
  faixa.innerHTML = textos.length ? textos.join('&nbsp;&nbsp;•&nbsp;&nbsp;') : '';
}

function formatarDataHoje(){
  const d = new Date();
  const dias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
}

function atualizarRelogio(){
  const agora = new Date();
  document.getElementById('hora').textContent = agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('data').textContent = formatarDataHoje();
}

async function carregarClima(){
  const el = document.getElementById('clima');
  if(!CLIMA_CHAVE){ el.textContent = ''; return; }
  try{
    const r = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(CLIMA_CIDADE)}&units=metric&lang=pt_br&appid=${CLIMA_CHAVE}`);
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    el.textContent = `${Math.round(j.main.temp)}°C, ${j.weather[0].description}`;
  }catch(e){
    el.textContent = '';
  }
}

async function carregarAgenda(){
  const agora = new Date();
  const fim = new Date(agora.getTime() + AGENDA_DIAS * 86400000);
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${CALENDAR_KEY}&singleEvents=true&orderBy=startTime&timeMin=${agora.toISOString()}&timeMax=${fim.toISOString()}&maxResults=50`;
  const r = await fetch(url);
  if(!r.ok) throw new Error('Falha ao ler agenda: ' + r.status);
  const j = await r.json();
  const ul = document.getElementById('agendaLista');
  const itens = (j.items || []);
  ul.innerHTML = itens.length
    ? itens.map(ev => {
        const ini = ev.start.dateTime ? new Date(ev.start.dateTime) : new Date(ev.start.date + 'T00:00:00');
        const dataTxt = ini.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'});
        const horaTxt = ev.start.dateTime ? ini.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : 'Dia inteiro';
        return `<li><strong>${escapeHtml(dataTxt)} ${escapeHtml(horaTxt)}</strong> - ${escapeHtml(ev.summary || 'Sem título')}</li>`;
      }).join('')
    : '<li>Nenhum evento nos próximos dias</li>';
}
/* ========== DRIVE: MÍDIA ========== */
let playlist = [];
let indiceMidia = 0;
let timerMidia = null;
let videoAtual = null;
let chaveMidia = '';

async function carregarMidia(){
  const params = new URLSearchParams({
    q: `'${DRIVE_PASTA_ID}' in parents and trashed = false`,
    fields: 'files(id,name,mimeType)',
    orderBy: 'name',
    pageSize: '200',
    key: DRIVE_KEY
  });
  const r = await fetch('https://www.googleapis.com/drive/v3/files?' + params.toString());
  if(!r.ok) throw new Error('Falha ao ler pasta do Drive: ' + r.status);
  const j = await r.json();
  playlist = (j.files || []).filter(f => f.mimeType.startsWith('image/') || f.mimeType.startsWith('video/'));
  const novaChave = playlist.map(f => f.id).join('|');
  if(novaChave !== chaveMidia){
    chaveMidia = novaChave;
    indiceMidia = 0;
    mostrarItem();
  }
}

function mostrarItem(){
  const box = document.getElementById('midia');
  clearTimeout(timerMidia);
  if(videoAtual){
    videoAtual.pause();
    videoAtual.removeAttribute('src');
    videoAtual.load();
    videoAtual = null;
  }
  if(!playlist.length){
    box.innerHTML = '<div class="vazio">Nenhum material encontrado na pasta</div>';
    return;
  }
  const item = playlist[indiceMidia % playlist.length];
  const url = `https://www.googleapis.com/drive/v3/files/${item.id}?alt=media&key=${DRIVE_KEY}`;
  box.innerHTML = '';
  if(item.mimeType.startsWith('video/')){
    const v = document.createElement('video');
    v.src = url;
    v.autoplay = true;
    v.muted = true;
    v.playsInline = true;
    v.onended = proximoItem;
    v.onerror = () => setTimeout(proximoItem, 3000);
    box.appendChild(v);
    videoAtual = v;
    v.play().catch(() => {});
  } else {
    const img = document.createElement('img');
    img.src = url;
    img.alt = item.name;
    img.onerror = () => setTimeout(proximoItem, 3000);
    box.appendChild(img);
    timerMidia = setTimeout(proximoItem, MIDIA_TEMPO_IMAGEM);
  }
}

function proximoItem(){
  clearTimeout(timerMidia);
  if(!playlist.length) return;
  indiceMidia = (indiceMidia + 1) % playlist.length;
  mostrarItem();
}

document.getElementById('midia').addEventListener('click', () => {
  if(videoAtual) videoAtual.muted = false;
});

/* ========== ATUALIZAÇÃO ========== */
async function atualizarTudo(){
  try{
    await carregarControle();
  }catch(e){
    console.error(e);
  }
  aplicarVisibilidade();
  const tarefas = [
    carregarAvisos(),
    carregarNoticias(),
    carregarAniversarios(),
    carregarRodape(),
    carregarAgenda(),
    carregarMidia(),
    carregarClima()
  ];
  const resultados = await Promise.allSettled(tarefas);
  resultados.forEach(r => {
    if(r.status === 'rejected') console.error(r.reason);
  });
}

/* ========== INÍCIO ========== */
atualizarRelogio();
setInterval(atualizarRelogio, 1000);
atualizarTudo();
setInterval(atualizarTudo, INTERVALO_ATUALIZACAO);
</script>
</body>
</html>
