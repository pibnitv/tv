<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07162b">
<title>PIBNI - Painel</title>
<style>
:root{--bg:#07162b;--bg2:#0e2f57;--card:rgba(255,255,255,.09);--accent:#d3dce7;--text:#fff;--muted:#b7c7dc}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:min(1.1vw,1.95vh)}
body{width:100vw;height:100vh;overflow:hidden;color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg) 70%);display:grid;grid-template-rows:auto 1fr auto}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:.25rem 1.2rem;border-bottom:.12rem solid var(--accent);background:#0004}
.marca{justify-self:start;align-self:stretch;display:flex;align-items:center}
.marca img{height:70%;width:auto;object-fit:contain;display:block}
.centro{text-align:center}
.centro h1{font-size:2.1rem;line-height:1}
.centro small{display:block;color:var(--muted);font-size:1.25rem;margin-top:.15rem}
.relogio{justify-self:end;text-align:right}
#hora{font-size:2.1rem;font-weight:800;line-height:1}
#data,#clima{font-size:1.05rem;color:var(--muted);margin-top:.12rem}
#stage{position:relative;overflow:hidden}
.scene{position:absolute;inset:0;padding:1.5rem 2.5rem;display:flex;flex-direction:column;opacity:0;transition:opacity .45s;overflow:hidden}
.scene.on{opacity:1}
.scene.midia{padding:0;background:#000}
.title{font-size:2.2rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem}
.notice{flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--card);border-left:.8rem solid var(--accent);border-radius:1.4rem;padding:2.5rem 3.5rem}
.notice.alta{border-left-color:#f5c542}
.tag{display:inline-block;align-self:flex-start;background:var(--accent);color:#111;font-weight:800;padding:.35rem 1rem;border-radius:99px;font-size:1.1rem;margin-bottom:1rem}
.notice.alta .tag{background:#f5c542}
.notice h1{font-size:4rem;line-height:1.05;margin-bottom:1rem}
.notice p{font-size:2rem;line-height:1.3;white-space:pre-line;color:#e8f0fb}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;align-content:start}
.birthday,.row{display:flex;align-items:center;gap:1rem;background:var(--card);border-radius:1rem;padding:.8rem 1rem}
.birthday .num{width:3.5rem;height:3.5rem;border-radius:50%;background:var(--accent);color:#111;display:grid;place-items:center;font-size:1.5rem;font-weight:800}
.birthday strong,.row{font-size:1.35rem}
.birthday.today{outline:.2rem solid var(--accent)}
.rows{flex:1;min-height:0;overflow:hidden}
.rows .inner{display:grid;gap:.75rem}
.row{justify-content:space-between}
.row b{color:var(--accent);white-space:nowrap}
.weather-main{display:flex;flex-direction:column;gap:1rem;flex:1;min-height:0}
.weather-now{display:flex;align-items:center;gap:1.5rem;background:var(--card);border-radius:1.2rem;padding:1.4rem}
.weather-now .emoji{font-size:6rem}
.weather-now .temp{font-size:5.5rem;font-weight:800;line-height:1}
.weather-now small{display:block;color:var(--muted);font-size:1.3rem;margin-top:.4rem}
.forecast{display:grid;grid-template-columns:repeat(6,1fr);gap:.7rem}
.day{background:var(--card);border-radius:1rem;padding:.9rem;text-align:center}
.day b{display:block;color:var(--accent);font-size:1.1rem;text-transform:capitalize}
.day .e{font-size:2.4rem;margin:.4rem 0}
.day span{display:block;font-size:1.15rem}
.weather-box{display:grid;grid-template-columns:1.4fr .9fr;gap:.8rem;min-height:0}
.weather-details{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.weather-details div{background:var(--card);border-radius:.8rem;padding:.9rem 1rem;color:var(--muted);font-size:1.05rem}
.weather-details b{display:block;color:#fff;font-size:1.8rem;margin-top:.25rem}
.midia .blur{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(25px) brightness(.4);transform:scale(1.1)}
.midia img.fg{position:relative;width:100%;height:100%;object-fit:contain}
.midia video,.midia iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
footer{border-top:.15rem solid var(--accent);background:#0006;height:4rem;display:flex;align-items:center;overflow:hidden}
#ticker{flex:1;overflow:hidden;white-space:nowrap}
#tickerTrack{display:flex;width:max-content}
.ticker-group{display:flex;align-items:center}
.ticker-item{display:inline-flex;align-items:center;font-size:1.25rem;padding-right:2.5rem}
.ticker-item img{height:2.4rem;width:auto;object-fit:contain;margin-right:.7rem}
.ticker-item b{background:var(--accent);color:#111;padding:.15rem .6rem;border-radius:.3rem}
.ticker-item.agenda{background:#f5c542;color:#111;border-radius:.35rem;padding:.15rem .7rem;margin-right:1.2rem;font-weight:800}
@keyframes tick{to{transform:translateX(-50%)}}
@keyframes subir{to{transform:translateY(-50%)}}
</style>
</head>
<body>
<header>
  <div class="marca"><img src="logo-pibni.png" alt="PIBNI"></div>
  <div class="centro"><h1>PIBNI</h1><small>Primeira Igreja Batista de Nova Iguaçu</small></div>
  <div class="relogio"><div id="hora">--:--</div><div id="data"></div><div id="clima"></div></div>
</header>
<main id="stage"></main>
<footer><div id="ticker"><div id="tickerTrack"></div></div></footer>
<script>
(()=>{
'use strict';
const CALENDAR_ID='pibnirj@gmail.com';
const CALENDAR_KEY='AIzaSyDVzB9Db_MhQXdDyIYBPP3XJd33VszOr64';
const DRIVE_PASTA_ID='1efxTP1wE4ywREhQZzm5CZpImgOmPrtO5';
const DRIVE_KEY='AIzaSyBNKJRabhnu9_uiYhIKErUWW-SdOrY6Woc';
const CLIMA={nome:'Nova Iguaçu',lat:-22.7592,lon:-43.4509};
const SHEET='https://docs.google.com/spreadsheets/d/e/2PACX-1vTxeZ8ELfbuLySISLTWO6UQbTFDwgz4HoLu2R-gdb7BTfpOvM8Uijgw3N9tymNYYmVbPxU-JY_jJMCp/pub?single=true&output=csv&gid=';
const GID={CONTROLE:'0',AVISOS:'1309089437',NOTICIAS:'852857065',ANIVERSARIOS:'289359330',RODAPE:'228875664'};
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
const yes=v=>['SIM','S','TRUE','1','LIGADA','LIGADO','ON'].includes(norm(v));
const S={ctrl:{},avisos:[],noticias:[],aniv:[],rodape:[],midia:[],clima:null,agenda:[]};
const cn=(k,d)=>{const n=parseFloat(String(S.ctrl[k]??d).replace(',','.'));return isNaN(n)?d:n};
const cb=(k,d=true)=>S.ctrl[k]===undefined||S.ctrl[k]===''?d:yes(S.ctrl[k]);
async function fetchText(url,ms=15000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(t)}}
function parseCSV(t){const rows=[];let row=[],f='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}
async function load(name){const rows=parseCSV(await fetchText(SHEET+GID[name]+'&t='+Date.now()));if(!rows.length)return[];const h=rows[0].map(x=>norm(x).replace(/\s+/g,'_'));const header=h.some(x=>['TITULO','TEXTO','NOME','ATIVO','DIA','MES','PRIORIDADE'].includes(x));return (header?rows.slice(1):rows).map(r=>header?Object.fromEntries(h.map((k,i)=>[k,String(r[i]??'').trim()])):r.map(x=>String(x??'').trim()))}
async function updateControl(){const rows=parseCSV(await fetchText(SHEET+GID.CONTROLE+'&t='+Date.now()));const c={};rows.forEach(r=>{const k=norm(r[0]).replace(/\s+/g,'_');if(k&&k!=='CHAVE')c[k]=String(r[1]??'').trim()});S.ctrl=c;if(yes(c.RECARREGAR_PAINEL)&&localStorage.getItem('pibni_recarga')!=='1'){localStorage.setItem('pibni_recarga','1');setTimeout(()=>location.reload(),500)}if(!yes(c.RECARREGAR_PAINEL))localStorage.removeItem('pibni_recarga')}
function campo(a,nome,i){return Array.isArray(a)?String(a[i]??'').trim():String(a[nome]??'').trim()}
function avisoAtivo(a){const titulo=campo(a,'TITULO',0)||campo(a,'AVISO',0);const ativo=campo(a,'ATIVO',2);return !!titulo&&(ativo===''||yes(ativo))}
function avisoAlto(a){const p=norm(campo(a,'PRIORIDADE',3)||campo(a,'IMPORTANTE',3));return ['ALTA','IMPORTANTE','SIM'].includes(p)}
function avisoHtml(a){const titulo=campo(a,'TITULO',0)||campo(a,'AVISO',0);let texto=campo(a,'TEXTO',1)||campo(a,'MENSAGEM',1);if(['SIM','NAO','NÃO','ALTA','NORMAL'].includes(norm(texto)))texto='';const alta=avisoAlto(a);return {alta,dur:(alta?cn('TEMPO_AVISO_IMPORTANTE_SEG',25):cn('TEMPO_AVISO_NORMAL_SEG',15))*1000,html:'<div class="notice'+(alta?' alta':'')+'"><span class="tag">'+(alta?'AVISO IMPORTANTE':'AVISO')+'</span><h1>'+esc(titulo)+'</h1>'+(texto?'<p>'+esc(texto)+'</p>':'')+'</div>'}}
function newsScenes(){const itens=S.noticias.filter(n=>Array.isArray(n)?n[0]:(n.TITULO||n.TEXTO||n.NOTICIA)).map(n=>Array.isArray(n)?n[0]:(n.TITULO||n.TEXTO||n.NOTICIA));if(!itens.length)return[];return[{dur:cn('TEMPO_NOTICIAS_SEG',12)*1000,html:'<div class="title">Notícias</div><div class="rows"><div class="inner">'+itens.slice(0,8).map(t=>'<div class="row"><span>'+esc(t)+'</span></div>').join('')+'</div></div>'}]}
function semana(base){const i=new Date(base.getFullYear(),base.getMonth(),base.getDate());i.setDate(i.getDate()-i.getDay());const f=new Date(i);f.setDate(f.getDate()+6);f.setHours(23,59,59,999);return [i,f]}
function birthdayScenes(){const hoje=new Date(),[ini,fim]=semana(hoje);const lista=S.aniv.map(r=>{let nome,dia,mes;if(Array.isArray(r)){nome=r[0];dia=+r[1];mes=+r[2]}else{nome=r.NOME;dia=+(r.DIA||'');mes=+(r.MES||'');if(r.DATA_NASCIMENTO){const m=String(r.DATA_NASCIMENTO).match(/(\d{1,2})\/(\d{1,2})/);if(m){dia=+m[1];mes=+m[2]}}}if(!nome||!dia||!mes)return null;const dt=new Date(hoje.getFullYear(),mes-1,dia);if(dt<ini||dt>fim)return null;return{nome,dt}}).filter(Boolean).sort((a,b)=>a.dt-b.dt);if(!lista.length)return[];const cards=lista.map(r=>'<div class="birthday '+(r.dt.toDateString()===hoje.toDateString()?'today':'')+'"><div class="num">'+r.dt.getDate()+'</div><strong>'+esc(r.nome)+(r.dt.toDateString()===hoje.toDateString()?' · HOJE':'')+'</strong></div>').join('');return[{dur:cn('TEMPO_ANIVERSARIANTES_SEG',20)*1000,html:'<div class="title">Aniversariantes da semana</div><div class="grid2">'+cards+'</div>'}]}
function eventosSemana(){
  const ini=new Date(); ini.setHours(0,0,0,0);
  const fim=new Date(ini); fim.setDate(fim.getDate()+6); fim.setHours(23,59,59,999);
  return S.agenda.filter(ev=>{
    const raw=ev.start&&(ev.start.dateTime||ev.start.date);
    if(!raw)return false;
    const dt=ev.start.dateTime?new Date(ev.start.dateTime):new Date(ev.start.date+'T12:00:00');
    return dt>=ini&&dt<=fim;
  }).sort((a,b)=>new Date(a.start.dateTime||a.start.date)-new Date(b.start.dateTime||b.start.date));
}
function agendaScene(){const lista=eventosSemana();if(!lista.length)return null;const rows=lista.map(ev=>{const ini=ev.start.dateTime?new Date(ev.start.dateTime):new Date(ev.start.date+'T00:00:00');const data=ini.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});const hora=ev.start.dateTime?ini.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'Dia inteiro';return '<div class="row"><span>'+esc(ev.summary||'Sem título')+'</span><b>'+esc(data+' '+hora)+'</b></div>'}).join('');const dup=lista.length>6?rows:'';return{dur:cn('TEMPO_AGENDA_SEG',20)*1000,scroll:lista.length>6,html:'<div class="title">Agenda da semana</div><div class="rows"><div class="inner">'+rows+dup+'</div></div>'}}
function wmo(n){if(n===0)return['☀️','Céu limpo'];if(n<=2)return['⛅','Parcialmente nublado'];if(n===3)return['☁️','Nublado'];if(n<=48)return['🌫️','Neblina'];if(n<=67)return['🌧️','Chuva'];if(n<=82)return['🌦️','Pancadas'];if(n>=95)return['⛈️','Tempestade'];return['🌡️','Instável']}
async function updateWeather(){const u='https://api.open-meteo.com/v1/forecast?latitude='+CLIMA.lat+'&longitude='+CLIMA.lon+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo&forecast_days=7';S.clima=JSON.parse(await fetchText(u));const c=S.clima.current;$('#clima').textContent=Math.round(c.temperature_2m)+'°C, '+wmo(c.weather_code)[1]}
function weatherScene(){
  if(!S.clima||!cb('MOSTRAR_INDICES',true))return null;
  const c=S.clima.current,d=S.clima.daily,par=wmo(c.weather_code);
  const dias=d.time.slice(0,6).map((iso,i)=>{
    const dt=new Date(iso+'T12:00:00');
    const nome=i===0?'Hoje':dt.toLocaleDateString('pt-BR',{weekday:'short'});
    return '<div class="day"><b>'+nome+'</b><div class="e">'+wmo(d.weather_code[i])[0]+'</div><span>'+Math.round(d.temperature_2m_min[i])+'° / '+Math.round(d.temperature_2m_max[i])+'°</span></div>';
  }).join('');
  return {dur:cn('TEMPO_INDICES_SEG',8)*1000,html:
    '<div class="title">Clima · '+CLIMA.nome+'</div>'+
    '<div class="weather-main">'+
      '<div class="weather-box">'+
        '<div class="weather-now"><div class="emoji">'+par[0]+'</div><div><div class="temp">'+Math.round(c.temperature_2m)+'°</div><small>'+par[1]+'</small></div></div>'+
        '<div class="weather-details">'+
          '<div>Sensação<b>'+Math.round(c.apparent_temperature)+'°</b></div>'+
          '<div>Umidade<b>'+Math.round(c.relative_humidity_2m)+'%</b></div>'+
          '<div>Vento<b>'+Math.round(c.wind_speed_10m)+' km/h</b></div>'+
          '<div>Hoje<b>'+Math.round(d.temperature_2m_min[0])+'° / '+Math.round(d.temperature_2m_max[0])+'°</b></div>'+
        '</div>'+
      '</div>'+
      '<div class="forecast">'+dias+'</div>'+
    '</div>'};
}
async function updateMedia(){if(!DRIVE_KEY||DRIVE_KEY.indexOf('SUA_CHAVE')===0)return;let files=[],token='';do{const u='https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent("'"+DRIVE_PASTA_ID+"' in parents and trashed=false")+'&fields=nextPageToken,files(id,name,mimeType)&orderBy=name&pageSize=200&key='+DRIVE_KEY+(token?'&pageToken='+token:'');const j=JSON.parse(await fetchText(u,20000));files=files.concat(j.files||[]);token=j.nextPageToken||''}while(token);S.midia=files.filter(f=>/^image\//.test(f.mimeType)||/^video\//.test(f.mimeType)||/presentation|pdf/.test(f.mimeType))}
function mediaScenes(){return S.midia.map(f=>{if(/^image\//.test(f.mimeType)){const src='https://lh3.googleusercontent.com/d/'+f.id+'=w1920';return{cls:'midia',dur:cn('TEMPO_FOTO_SEG',10)*1000,html:'<div class="blur"></div><img class="fg" src="'+src+'" alt="'+esc(f.name)+'">',mount:el=>{const im=el.querySelector('img');im.onload=()=>{el.querySelector('.blur').style.backgroundImage='url("'+im.src+'")'};im.onerror=()=>{im.src='https://drive.google.com/thumbnail?id='+f.id+'&sz=w1920'}}}}if(/^video\//.test(f.mimeType))return{cls:'midia',dur:cn('TEMPO_VIDEO_SEG',180)*1000,video:true,html:'<video src="https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media&key='+DRIVE_KEY+'" autoplay muted playsinline></video>'};const src=/presentation/.test(f.mimeType)?'https://docs.google.com/presentation/d/'+f.id+'/embed?start=true&loop=false&delayms=8000':'https://drive.google.com/file/d/'+f.id+'/preview';return{cls:'midia',dur:cn('TEMPO_SLIDES_SEG',50)*1000,html:'<iframe src="'+src+'" allow="autoplay; fullscreen"></iframe>'}})}
function renderTicker(){
  const planilha=S.rodape.filter(x=>Array.isArray(x)?x[0]&&(x[1]===''||yes(x[1])):yes(x.ATIVO)&&(x.TEXTO||x.MENSAGEM)).map(x=>Array.isArray(x)?x[0]:(x.TEXTO||x.MENSAGEM));
  const agenda=cb('MOSTRAR_AGENDA',true)?eventosSemana().map(ev=>{
    const ini=ev.start.dateTime?new Date(ev.start.dateTime):new Date(ev.start.date+'T00:00:00');
    const data=ini.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
    const hora=ev.start.dateTime?' '+ini.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
    return '<span class="ticker-item agenda">Agenda: '+esc((ev.summary||'Sem título')+' · '+data+hora)+'</span>';
  }):[];
  const textos=planilha.map(t=>'<span class="ticker-item">'+esc(t)+'</span>').concat(agenda);
  const marca='<span class="ticker-item"><img src="logo-pibni.png" alt=""><b>Primeira Igreja Batista de Nova Iguaçu</b></span>';
  const unit=marca+textos.join('');
  const t=$('#tickerTrack');
  t.style.animation='none';
  t.innerHTML='<div class="ticker-group">'+unit+'</div><div class="ticker-group">'+unit+'</div>';
  void t.offsetWidth;
  const w=t.firstElementChild.getBoundingClientRect().width;
  t.style.animation='tick '+Math.max(22,w/75)+'s linear infinite';
}
function sceneList(){const outros=[],importantes=[];if(cb('MOSTRAR_AVISOS',true))S.avisos.filter(avisoAtivo).forEach(a=>{const s=avisoHtml(a);(s.alta?importantes:outros).push(s)});if(cb('MOSTRAR_AGENDA',true)){const g=agendaScene();if(g)outros.push(g)}if(cb('MOSTRAR_NOTICIAS',true))newsScenes().forEach(s=>outros.push(s));if(cb('MOSTRAR_ANIVERSARIANTES',true)||cb('MOSTRAR_ANIVERSARIOS',true))birthdayScenes().forEach(s=>outros.push(s));const w=weatherScene();if(w)outros.push(w);if(cb('MOSTRAR_MIDIA_DRIVE',true)||cb('MOSTRAR_MIDIA',true))mediaScenes().forEach(s=>outros.push(s));if(!outros.length&&!importantes.length)return[{dur:8000,html:'<div class="title">PIBNI</div><div class="notice"><h1>Primeira Igreja Batista de Nova Iguaçu</h1><p>Cultos transmitidos ao vivo: domingo às 10h e às 18h45.</p></div>'}];if(!importantes.length)return outros;const cada=Math.max(1,cn('AVISO_IMPORTANTE_REPETE_A_CADA',3)),saida=[];let k=0;outros.forEach((s,i)=>{saida.push(s);if((i+1)%cada===0){saida.push(importantes[k%importantes.length]);k++}});if(!k)saida.push(importantes[0]);return saida}
const stage=$('#stage');
async function playScene(s){const old=stage.firstElementChild;if(old){old.classList.remove('on');await sleep(400);old.querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src');v.load()});old.querySelectorAll('iframe').forEach(f=>{f.src='about:blank'});old.remove()}const el=document.createElement('div');el.className='scene '+(s.cls||'');el.innerHTML=s.html;stage.appendChild(el);if(s.mount)s.mount(el);if(s.scroll){const box=el.querySelector('.rows'),inner=el.querySelector('.inner');if(box&&inner&&inner.scrollHeight>box.clientHeight)inner.style.animation='subir '+Math.max(12,inner.scrollHeight/40)+'s linear infinite'}await sleep(40);el.classList.add('on');if(s.video){const v=el.querySelector('video');await new Promise(ok=>{const fim=()=>ok();v.onended=fim;v.onerror=fim;setTimeout(fim,s.dur||180000);v.play().catch(()=>{})})}else await sleep(s.dur||8000)}
async function cycle(){while(true){try{const lista=sceneList();for(let i=0;i<lista.length;i++)await playScene(lista[i])}catch(e){console.error(e);await sleep(2500)}}}
function clock(){const d=new Date();$('#hora').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('#data').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
async function updateAgenda(){if(!CALENDAR_KEY||CALENDAR_KEY.indexOf('SUA_CHAVE')===0){renderTicker();return}const agora=new Date(),fim=new Date(agora.getTime()+14*86400000);const u='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(CALENDAR_ID)+'/events?key='+CALENDAR_KEY+'&singleEvents=true&orderBy=startTime&timeMin='+agora.toISOString()+'&timeMax='+fim.toISOString()+'&maxResults=40';const j=JSON.parse(await fetchText(u));S.agenda=j.items||[];renderTicker()}
async function updateSheets(){const nomes=['AVISOS','NOTICIAS','ANIVERSARIOS','RODAPE'];const r=await Promise.allSettled(nomes.map(load));r.forEach((x,i)=>{if(x.status!=='fulfilled')return;if(nomes[i]==='AVISOS')S.avisos=x.value;if(nomes[i]==='NOTICIAS')S.noticias=x.value;if(nomes[i]==='ANIVERSARIOS')S.aniv=x.value;if(nomes[i]==='RODAPE')S.rodape=x.value});renderTicker()}
function safe(f){return ()=>Promise.resolve().then(f).catch(e=>console.warn(e.message))}
  let versaoPainel='';
async function checarAtualizacao(){
  try{
    const html=await fetchText(location.href.split('#')[0].split('?')[0]+'?t='+Date.now(),12000);
    const marca=String(html.length)+'|'+html.slice(-120);
    if(!versaoPainel){versaoPainel=marca;return}
    if(marca!==versaoPainel) location.reload();
  }catch(e){console.warn(e.message)}
}
function recargaDaMadrugada(){
  const agora=new Date();
  const alvo=new Date(agora);
  alvo.setHours(4,0,0,0);
  if(alvo<=agora) alvo.setDate(alvo.getDate()+1);
  setTimeout(()=>location.reload(),alvo-agora);
}
clock();
setInterval(clock,1000);
  setInterval(safe(checarAtualizacao),300000);
recargaDaMadrugada();
renderTicker();
(async()=>{
await Promise.allSettled([updateControl(),updateSheets(),updateAgenda(),updateWeather(),updateMedia()]);
setInterval(safe(updateControl),60000);
setInterval(safe(updateSheets),300000);
setInterval(safe(updateAgenda),600000);
setInterval(safe(updateMedia),600000);
setInterval(safe(updateWeather),900000);
cycle();
})();
})();
</script>
